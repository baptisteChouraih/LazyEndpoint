openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: A small sample API used to exercise LazyEndpoint.
servers:
  - url: https://petstore.example.com/v1
tags:
  - name: pets
    description: Everything about pets
  - name: store
    description: Orders and inventory
  - name: users
    description: Operations on users

paths:
  /pets:
    get:
      tags: [pets]
      operationId: listPets
      summary: List all pets
      description: |
        Returns every pet in the store. Results are paginated with `limit`
        and `offset` query parameters.
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: status
          in: query
          description: Filter pets by status
          schema:
            type: string
            enum: [available, pending, sold]
      responses:
        "200":
          description: A paged array of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [pets]
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        description: The pet to add to the store
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        description: The id of the pet to retrieve
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [pets]
      operationId: getPetById
      summary: Get a pet by id
      responses:
        "200":
          description: The requested pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [pets]
      operationId: deletePet
      summary: Delete a pet
      deprecated: true
      responses:
        "204":
          description: Pet deleted

  /store/inventory:
    get:
      tags: [store]
      operationId: getInventory
      summary: Returns pet inventories by status
      responses:
        "200":
          description: A map of status codes to quantities
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32

  /store/order:
    post:
      tags: [store]
      operationId: placeOrder
      summary: Place an order for a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order

  /users/{username}:
    get:
      tags: [users]
      operationId: getUserByName
      summary: Get a user by username
      parameters:
        - name: username
          in: path
          required: true
          description: The name that needs to be fetched
          schema:
            type: string
      responses:
        "200":
          description: The requested user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found

  /health:
    get:
      operationId: healthCheck
      summary: Liveness probe
      responses:
        "200":
          description: The service is up

components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the pet
        name:
          type: string
          description: Name of the pet
        status:
          type: string
          enum: [available, pending, sold]
          description: Current adoption status
        category:
          $ref: "#/components/schemas/Category"
        photoUrls:
          type: array
          items:
            type: string
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [available, pending, sold]
        category:
          $ref: "#/components/schemas/Category"
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Order:
      type: object
      required: [petId, quantity]
      properties:
        id:
          type: integer
          format: int64
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        status:
          type: string
          enum: [placed, approved, delivered]
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
